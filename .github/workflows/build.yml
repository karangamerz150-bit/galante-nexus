name: GALANTE NEXUS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q galante_nexus_source.zip -d project

      - name: Build
        run: |
          cd project/galante_nexus
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Make firmware
        run: |
          cd project/galante_nexus
          esptool.py --chip esp32s3 merge_bin \
            -o galante_nexus.bin \
            --flash_mode qio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x20000 build/galante_nexus.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: GALANTE-NEXUS-Firmware
          path: project/galante_nexus/galante_nexus.bin
